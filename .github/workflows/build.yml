name: Build MemoGenerator.exe

on:
  push:
  pull_request:
  workflow_dispatch:

# タグ（vX.Y.Z）のときに Release を作ってファイルを添付するため
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # テスト → PyInstaller のインストール → フォルダ形式でビルド（dist\MemoGenerator\）
      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      # settings.json が無い状態で起動できること・既定の settings.json が作られることを確認し、
      # 起動からウィンドウ表示までの時間を3回測る（1回目はウイルス対策ソフトの初回スキャン込み）
      - name: Smoke test and startup time
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke\MemoGenerator"
          New-Item -ItemType Directory -Path (Split-Path $dir) | Out-Null
          Copy-Item dist\MemoGenerator $dir -Recurse
          Remove-Item (Join-Path $dir "settings.json")
          $env:MEMOGENERATOR_DATA_DIR = Join-Path $env:RUNNER_TEMP "smoke-data"
          $exe = Join-Path $dir "MemoGenerator.exe"
          $times = @()
          for ($i = 1; $i -le 3; $i++) {
            $ready = Join-Path $env:RUNNER_TEMP "ready-$i.txt"
            $env:MEMOGENERATOR_READY_FILE = $ready
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -PassThru
            while (-not (Test-Path $ready)) {
              if ($p.HasExited) { throw "MemoGenerator.exe が終了しました（終了コード $($p.ExitCode)）" }
              if ($sw.Elapsed.TotalSeconds -gt 60) { throw "60秒たってもウィンドウが表示されません" }
              Start-Sleep -Milliseconds 20
            }
            $sw.Stop()
            $times += $sw.Elapsed.TotalSeconds
            Start-Sleep -Seconds 1
            if ($p.HasExited) { throw "MemoGenerator.exe が表示直後に終了しました" }
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit()
          }
          $created = Get-Content -Raw -Encoding utf8 (Join-Path $dir "settings.json")
          $bundled = Get-Content -Raw -Encoding utf8 settings.json
          if ($created -ne $bundled) { throw "作成された settings.json が既定値と一致しません" }
          Write-Host "OK: 起動でき、既定の settings.json が作成されました"
          Write-Host ("起動時間（フォルダ形式、ウィンドウ表示まで）: " + (($times | ForEach-Object { "{0:N2}秒" -f $_ }) -join " / "))

      - name: Collect files
        shell: cmd
        run: copy /y README.md dist\MemoGenerator\README.md

      # zip の中身：MemoGenerator.exe・settings.json・README.md・_internal フォルダ
      - uses: actions/upload-artifact@v4
        with:
          name: MemoGenerator
          path: dist/MemoGenerator/
          if-no-files-found: error

      # タグ vX.Y.Z をプッシュしたときだけ：Releases に MemoGenerator-vX.Y.Z.zip を載せる
      # （zip を展開すると MemoGenerator フォルダができる）
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Select-String -Path src\memogenerator\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$version") {
            throw "タグ $tag と src\memogenerator\__init__.py の __version__ ($version) が一致しません。__version__ を v を除いたタグと同じ値にしてください"
          }
          $zip = "MemoGenerator-$tag.zip"
          Compress-Archive -Path dist\MemoGenerator -DestinationPath $zip
          $notes = @"
          ## ダウンロードと導入
          1. 下の **$zip** をダウンロード（「Source code」はソースコードで、exe は入っていません）
          2. zip を右クリック →「すべて展開」→ できた **MemoGenerator フォルダをフォルダごと** 好きな場所に置く
          3. フォルダ内の MemoGenerator.exe を起動（Python のインストールは不要）

          - exe だけを別の場所にコピーしても動きません（_internal フォルダが必要）。デスクトップから起動したい場合はショートカットを作ってください
          - 以前の版から更新する場合は、settings.json も新しいものに置き換えてください（項目を独自に変更している場合は差分を反映）

          詳しくは同梱の README.md を参照してください。
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 画面からリリースを先に作った場合など：既存のリリースに添付する
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "MemoGenerator $tag" --notes $notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "リリースの作成・添付に失敗しました" }
          Write-Host "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
